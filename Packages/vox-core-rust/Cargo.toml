[workspace]
members = [
  "crates/vox-core",
  "crates/vox-core-uniffi",
]
default-members = ["crates/vox-core", "crates/vox-core-uniffi"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.87.0"
license = "AGPL-3.0-only"
repository = "https://github.com/CodyBontecou/vox.md"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["std"] }
chrono-tz = "=0.10.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
thiserror = "=2.0.12"
uniffi = { version = "=0.32.0", default-features = false }
uuid = { version = "=1.16.0", features = ["serde", "v5"] }

vox-core = { path = "crates/vox-core", version = "=0.1.0-alpha.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
